# Smoke do playground (D121). Com o repositório privado (docs/PLANO-ACESSO.md, fase 5), roda em push na main e nas
# branches rotina/** e, na teste, sob demanda (gh workflow run smoke.yml --ref teste), para caber na cota grátis do Actions.
# Mesmo comando do terminal: build + smoke no Chrome headless (scripts/dev/smoke.js), auditoria da UI
# e conferência de que o build commitado está em dia (index.html, dist/ e tests/smoke.html regerados).
name: Smoke

on:
  push:
    branches: [main, 'rotina/**'] # rotina/**: a rotina diária sobe aqui, espera o check e só então avança a main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Build + smoke (Chrome headless)
        run: node scripts/build-index.js --smoke --avisos
        env:
          CHROME: /usr/bin/google-chrome

      - name: Auditoria da UI (tokens e componentes do DS)
        run: node scripts/dev/audit-ui.js

      - name: MCP do Castanha DS (handshake, ferramentas, resources e prompts)
        run: node mcp/test.js

      - name: Acesso no Vercel (middleware.js com códigos de teste)
        run: node tests/middleware.test.js

      - name: Tab Débitos (todo item em aberto do Conferir liga a um componente ou é geral)
        run: node tests/debitos.test.js

      - name: Numeração D/C (sem repetido, sem apelido sobrando)
        run: node scripts/dev/numerar.js --check

      - name: Changelog dentro das regras (repositório público)
        run: node scripts/dev/changelog.js check

      - name: Painel de saúde em dia (aviso)
        run: |
          if ! git diff --quiet -- docs/SAUDE-TECNICA.md tests/ultimo-smoke.json; then
            echo "::warning::O painel de saúde commitado não bate com este run. Rode node scripts/build-index.js --smoke e commite docs/SAUDE-TECNICA.md e tests/ultimo-smoke.json."
          fi

      - name: Build commitado está em dia
        run: |
          if ! git diff --quiet -- index.html tests/smoke.html dist; then
            echo "::error::O build commitado está desatualizado. Rode node scripts/build-index.js e commite index.html, dist/ e tests/smoke.html."
            git diff --stat -- index.html tests/smoke.html dist
            exit 1
          fi
