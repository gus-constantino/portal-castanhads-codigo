<!-- Fundação -->
<link rel="stylesheet" href="styles/tokens.css?v=3e73e033" />

<link rel="stylesheet" href="styles/report.css?v=afdad39f" />
<link rel="stylesheet" href="styles/docs.css?v=6cf3c5ef" />
</head>
<body>

<!-- Barra do topo = .Heading do Header do [CastanhaDS] Sponsor Templates (template provisório, templates/sponsor-header);
     Relatório e Tema entram nos Trailling Items pelo app.js -->
<header class="pg-header">
  <cds-sponsor-header id="top-header" show-title="false" show-notification="false" show-close="false"></cds-sponsor-header>
  <div class="pg-header__actions" id="top-actions">
    <cds-icon-button id="report-btn" kind="default" appearance="neutral" size="small" icon="chart-up-line" label="Abrir relatório do projeto" pressed="false"></cds-icon-button>
    <cds-tooltip id="report-tip" for="report-btn" placement="bottom" show-label="false" text="Relatório"></cds-tooltip>
    <cds-icon-button id="theme" kind="default" appearance="neutral" size="small" icon="dark-mode-line" label="Ativar tema escuro" pressed="false"></cds-icon-button>
    <cds-tooltip id="theme-tip" for="theme" placement="bottom" show-label="false" text="Tema escuro"></cds-tooltip>
  </div>
</header>

<div class="pg-shell">
  <nav class="pg-sidebar" aria-label="Componentes">
    <cds-search-input class="pg-search" id="search" label="Buscar componente" show-label="false" placeholder="Buscar componente" show-required="false" show-supporting-content="false"></cds-search-input>
    <ul class="pg-nav pg-nav--home" id="nav-home" aria-label="Início"></ul>
    <p class="pg-nav-title">Componentes</p>
    <ul class="pg-nav" id="nav"></ul>
    <p class="pg-nav-title pg-nav-title--res" id="nav-res-title">Recursos de suporte</p>
    <ul class="pg-nav" id="nav-res" aria-labelledby="nav-res-title"></ul>
  </nav>

  <main class="pg-canvas">
    <!-- Topo da página = .Title Content do mesmo Header (a linha .Heading é a barra do topo) -->
    <div class="pg-toolbar" id="toolbar">
      <cds-sponsor-header id="page-header" show-heading="false"></cds-sponsor-header>
    </div>
    <div class="pg-cover" id="cover" hidden></div>
    <div class="pg-tabs" id="tabs" hidden></div>
    <div class="pg-stage" id="stage">
      <div class="pg-stage-bar" id="viewport"></div>
      <div class="pg-stage-cover" id="stage-cover">
        <div class="pg-frame" id="frame">
          <div class="pg-frame-meta"><span><span id="vp-frame-lbl">Viewport:</span> <code id="vp-readout">fluido</code></span><span><span id="rval-lbl">Valor:</span> <code id="rval">—</code> <span id="rdone"></span></span></div>
          <div class="pg-preview" id="preview"></div>
        </div>
      </div>
      <section class="pg-react" id="react" aria-labelledby="react-title" hidden></section>
    </div>
    <div class="pg-docs" id="docs" role="tabpanel" hidden></div>
  </main>

  <aside class="pg-panel" aria-label="Controles">
    <h2>Controles</h2>
    <div id="panel"></div>
  </aside>
</div>

<main class="pg-report" id="report" aria-label="Saúde da stack Figma" hidden></main>

<!-- Kit do playground (registro + controles) -->
<script src="scripts/cds-element.js?v=c2efeae3"></script>
<script src="scripts/playground-kit.js?v=fe8b67a8"></script>
<script src="scripts/docs-kit.js?v=40205e55"></script>
<script src="scripts/tokens-kit.js?v=40de3ac0"></script>
<script src="integration/react-data.js?v=d5d4d0a2"></script>
<script src="integration/assets-react.js?v=fc20e86e"></script>
<script src="scripts/react-kit.js?v=d2c91f70"></script>
<script src="scripts/assets-manifest.js?v=a1ab1bac"></script>
<!-- Componentes — GERADO por scripts/build-index.js (ordem de dependência) -->
<!-- @components:js -->
<script src="dist/cds.js?v=73eaab37"></script>
<!-- /@components:js -->
<!-- Templates provisórios (fora do menu) -->
<script src="templates/sponsor-header/sponsor-header.js?v=bb769170"></script>
<!-- Shell: side menu, rotas, tema, viewport, relatório -->
<script src="scripts/figma-status.js?v=f34b6f35"></script>
<script src="scripts/report.js?v=9d8b316e"></script>
<script src="scripts/app.js?v=dfa9c129"></script>
</body>
</html>
