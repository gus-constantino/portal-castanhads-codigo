<!doctype html>
<!-- Links de entrega (docs/PLANO-ACESSO.md, fase 3). Só o perfil Completo abre esta tela (middleware.js).
     Escolhe uma entrega de entregas/ (lista em paginas.json, gerada pelo build-index), a validade (2, 7, 14, 30 ou outro valor de 1 a 90 dias)
     e pede o link assinado em POST /acesso/links. Quem recebe o link abre o portal em modo entrega: só os itens dela.
     Componentes do DS, do pacote público (dist/cds-publico.*): Card, Radio Select Input, Radio Button Group,
     Main Button, Text Input, Alert e Toast. -->
<html lang="pt-BR" data-theme="light">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="robots" content="noindex" />
<link rel="icon" type="image/svg+xml" href="../../assets/brand/favicon.svg" />
<link rel="icon" type="image/png" sizes="32x32" href="../../assets/brand/favicon-32.png" />
<link rel="apple-touch-icon" href="../../assets/brand/apple-touch-icon.png" />
<title>Links de entrega · Castanha DS</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700;900&family=Work+Sans:wght@500;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../../styles/tokens.css" />
<link rel="stylesheet" href="../../styles/shared.css" />
<link rel="stylesheet" href="../../styles/icons.css" />
<link rel="stylesheet" href="../../dist/cds-publico.css" />
<style>
  body{ margin:0; min-height:100svh; display:grid; place-items:center; background:var(--common-colors-surface-01); color:var(--common-colors-text-intense); font:var(--text-style-body-regular); }
  .lk{ box-sizing:border-box; width:min(100% - 2 * var(--common-sizes-16), calc(2 * var(--common-sizes-200) + var(--common-sizes-120))); padding:var(--common-sizes-40) 0; }
  .lk .cds-card__slot{ display:flex; flex-direction:column; align-items:stretch; gap:var(--common-sizes-24); }
  .lk__text{ display:flex; flex-direction:column; gap:var(--common-sizes-8); }
  .lk__title{ margin:0; font:var(--text-style-title-large); }
  .lk__lede{ margin:0; color:var(--common-colors-text-medium); }
  .lk__field{ display:flex; flex-direction:column; gap:var(--common-sizes-8); }
  .lk__label{ margin:0; font:var(--text-style-subtitle-small); }
  .lk__actions{ display:flex; flex-wrap:wrap; align-items:center; gap:var(--common-sizes-16) var(--common-sizes-24); }
  .lk__out{ display:flex; flex-direction:column; align-items:flex-start; gap:var(--common-sizes-12); }
  .lk__out[hidden]{ display:none; }
  .lk cds-radio-select-input, .lk__out cds-text-input, .lk__out cds-alert{ width:100%; align-self:stretch; } /* Text Field em Fill, na largura do card */
  .lk__toast{ position:fixed; left:50%; bottom:var(--common-sizes-24); transform:translateX(-50%); }
  .lk cds-quantity-input[hidden]{ display:none; }
</style>
</head>
<body>
<main class="lk">
  <cds-card has-border="true">
    <div class="lk__text">
      <h1 class="lk__title">Links de entrega</h1>
      <p class="lk__lede">Gere um link que abre o portal só com as páginas de uma entrega para dev: os componentes, os building blocks e o handoff. Quem recebe não precisa de código e vê só isso até o link vencer.</p>
    </div>
    <cds-radio-select-input id="lk-page" label="Entrega" show-required="false" placeholder="Escolha a entrega" show-supporting-content="false" show-lead-icon="false"></cds-radio-select-input>
    <div class="lk__field">
      <p class="lk__label" id="lk-days-label">Validade</p>
      <cds-radio-button-group id="lk-days" label="Validade" name="lk-dias">
        <cds-radio-button label="2 dias" value="2" status="unselected"></cds-radio-button>
        <cds-radio-button label="7 dias" value="7" status="unselected"></cds-radio-button>
        <cds-radio-button label="14 dias" value="14" status="selected"></cds-radio-button>
        <cds-radio-button label="30 dias" value="30" status="unselected"></cds-radio-button>
        <cds-radio-button label="Outro" value="outro" status="unselected"></cds-radio-button>
      </cds-radio-button-group>
      <!-- Outro: quantos dias, de 1 a 90 (o middleware recusa fora disso). [Beta] Quantity Input do DS -->
      <cds-quantity-input id="lk-days-n" label="Dias de validade" value="3" min="1" max="90" suffix=" dias" supporting="De 1 a 90 dias" show-required="false" hidden></cds-quantity-input>
    </div>
    <div class="lk__actions">
      <cds-main-button id="lk-go" label="Gerar link" show-lead-icon="false" show-trailing-icon="false"></cds-main-button>
      <cds-link id="lk-ver" label="Ver como a pessoa dev vê" href="/" appearance="accent" icon="link-line" target="_blank"></cds-link>
      <cds-link label="Links ativos e links de página" href="../paginas/" appearance="accent" icon="link-line"></cds-link>
    </div>
    <div class="lk__out" id="lk-out" hidden></div>
  </cds-card>
</main>

<script src="../../scripts/cds-element.js"></script>
<script src="../../scripts/playground-kit.js"></script>
<script src="../../scripts/assets-manifest.js"></script>
<script src="../../dist/cds-publico.js"></script>
<script>
(function(){
  "use strict";
  var sel = document.getElementById("lk-page"), days = document.getElementById("lk-days"), go = document.getElementById("lk-go"), out = document.getElementById("lk-out"), busy = false, paginas = [];
  // "Ver como a pessoa dev vê": o portal com ?entrega=<slug>, que o perfil Completo pode abrir (scripts/entrega.js)
  var verLink = document.getElementById("lk-ver");
  function ver(){ var m = /^\/entregas\/([a-z0-9-]+)\/$/.exec(sel.value || sel.getAttribute("value") || ""); verLink.hidden = !m; if (m) verLink.setAttribute("href", "/?entrega=" + m[1] + "#/"); }
  sel.addEventListener("cds-change", function(){ setTimeout(ver, 0); });
  // validade: uma das opções ou, em "Outro", o número digitado (1 a 90)
  var diasN = document.getElementById("lk-days-n");
  function outro(){ var r = days.querySelector('cds-radio-button[status="selected"]'); return !!r && r.getAttribute("value") === "outro"; }
  days.addEventListener("cds-change", function(){ setTimeout(function(){ diasN.hidden = !outro(); }, 0); });
  function dias(){
    var r = days.querySelector('cds-radio-button[status="selected"]');
    if (!r) return 14;
    if (r.getAttribute("value") !== "outro") return Number(r.getAttribute("value"));
    var n = Math.round(Number(String(diasN.value != null ? diasN.value : diasN.getAttribute("value")).replace(/\D/g, "")));
    return Math.min(90, Math.max(1, n || 1));
  }
  function data(iso){ return new Date(iso).toLocaleDateString("pt-BR", { day: "2-digit", month: "long", year: "numeric" }); }
  function aviso(appearance, label, text){ out.hidden = false; out.innerHTML = ""; out.appendChild(CDS.create("cds-alert", { appearance: appearance, label: label, text: text, "show-close-button": "false" })); }
  function toast(text){
    var t = document.body.appendChild(CDS.create("cds-toast", { appearance: "positive", text: text, "show-trailing-item": "false" }));
    t.classList.add("lk__toast"); setTimeout(function(){ if (t.isConnected) t.remove(); }, 3000);
  }
  fetch("paginas.json", { cache: "no-store" }).then(function(r){ return r.json(); }).then(function(list){
    paginas = list;
    sel.options = list.map(function(p){ return { value: p.caminho, label: p.titulo }; });
    if (list.length) sel.setAttribute("value", list[0].caminho);
    ver();
  }).catch(function(){ aviso("warning", "Lista de entregas indisponível", "Não deu para ler as entregas. Recarregue a página."); });

  function gerar(){
    if (busy) return;
    // a escolha atual fica na propriedade value; o atributo guarda só a inicial
    var caminho = sel.value || sel.getAttribute("value") || "";
    if (!caminho){ aviso("warning", "Escolha a entrega", "O link abre o portal só com as páginas dela."); return; }
    busy = true; go.setAttribute("disabled", "");
    fetch("/acesso/links", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ caminho: caminho, dias: dias(), titulo: (paginas.filter(function(x){ return x.caminho === caminho; })[0] || {}).titulo }), credentials: "same-origin" })
      .then(function(r){
        // sem o middleware (GitHub Pages, servidor local) a rota não existe
        if (!/json/.test(r.headers.get("content-type") || "")) throw new Error("Links de entrega funcionam no endereço do Vercel, onde o portal pede código.");
        return r.json().then(function(j){ if (!r.ok) throw new Error(j.erro || "Não deu para gerar o link agora."); return j; });
      })
      .then(function(j){
        var p = paginas.filter(function(x){ return x.caminho === j.caminho; })[0];
        out.hidden = false; out.innerHTML = "";
        out.appendChild(CDS.create("cds-alert", { appearance: "positive", label: "Link pronto", text: (p ? p.titulo : j.caminho) + ". Vale até " + data(j.vence) + ".", "show-close-button": "false" }));
        var field = out.appendChild(CDS.create("cds-text-input", { label: "Link", value: j.link, "show-required": "false", "show-supporting-content": "false", "show-lead-icon": "false", "show-trailing-item": "false" }));
        var f = field.querySelector("input"); if (f){ f.readOnly = true; f.addEventListener("focus", function(){ f.select(); }); }
        var copy = out.appendChild(CDS.create("cds-main-button", { label: "Copiar link", kind: "ghost", appearance: "neutral", size: "small", "lead-icon": "copy-line", "show-trailing-icon": "false" }));
        copy.addEventListener("click", function(){
          (navigator.clipboard ? navigator.clipboard.writeText(j.link) : Promise.reject()).then(function(){ toast("Link copiado"); }, function(){ if (f){ f.focus(); f.select(); } });
        });
      })
      .catch(function(e){ aviso("warning", "Link não gerado", e.message); })
      .then(function(){ busy = false; go.removeAttribute("disabled"); });
  }
  go.addEventListener("click", gerar);
})();
</script>
</body>
</html>
